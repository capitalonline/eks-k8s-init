apiVersion: v1
kind: Service
metadata:
  labels:
    name: kata-monitor
  name: kata-monitor
  namespace: monitoring
spec:
  clusterIP: None
  clusterIPs:
  - None
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 9979
    protocol: TCP
    targetPort: 9979
  selector:
    name: kata-monitor
  sessionAffinity: None
  type: ClusterIP
