apiVersion: v1
kind: ServiceAccount
metadata:
  name: virtual-kubelet
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: virtual-kubelet-binding
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: virtual-kubelet-cluster-role
subjects:
  - kind: ServiceAccount
    name: virtual-kubelet
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: virtual-kubelet-cluster-role
  namespace: kube-system
rules:
  - apiGroups:
      - ""
    resources:
      - events
      - endpoints
      - configmaps
      - persistentvolumes
      - persistentvolumeclaims
      - pods
      - pods/status
      - secrets
      - services
      - nodes
      - nodes/status
      - pods/log
      - pods/exec
      - nodes/log
      - nodes/proxy
    verbs:
      - patch
      - get
      - watch
      - list
      - delete
      - update
      - create
  - apiGroups:
      - "coordination.k8s.io"
    resources:
      - leases
    verbs:
      - get
      - create
      - update
  - apiGroups:
      - "apps"
    resources:
      - "statefulsets"
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - "eci-agent.eci-agent"
    resources:
      - "vnodes"
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - "eci-agent.eci-agent"
    resources:
      - "vpods"
    verbs:
      - get
      - list
      - watch
      - create
      - update
