apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: vpc-cni
  namespace: kube-system
spec:
  config: '{
    "name":"vpc-cni",
    "cniVersion":"0.3.1",
    "plugins":[
        {
            "type":"vpc-cni",
            "server_socket":"/run/cni/vpc-cni.sock"
        },{
            "type": "bandwidth",
            "capabilities": {"bandwidth": true}
        }
    ]
}'

