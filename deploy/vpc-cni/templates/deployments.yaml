apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpc-cni-manager
  namespace: kube-system
  labels:
    app: vpc-cni
    component: vpc-cni-manager
spec:
  replicas: 3 
  selector:
    matchLabels:
      app: vpc-cni
      component: vpc-cni-manager
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: vpc-cni
        component: vpc-cni-manager
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: vpc-cni
                  component: vpc-cni-manager
              topologyKey: kubernetes.io/hostname
      priorityClassName: system-cluster-critical
      serviceAccountName: vpc-cni
      hostNetwork: true
      containers:
      - name: cni-manager
        image: capitalonline/vpc-cni:v3.0.1 
        imagePullPolicy: Always 
        ports:
        - name: http-metrics
          containerPort: 9898
          protocol: TCP
        command:
        - /cni/vpc-cni-manager
        - --kube-client-qps=300
        - --kube-client-burst=600
        - --controller-concurrency=Node=1,Pod=1,IPAM=1,NetworkStatus=1,SubnetStatus=1,Quota=1,IPInstance=1
        env:
        - name: DEFAULT_NETWORK_TYPE
          value: "Underlay" 
        - name: DEFAULT_IP_FAMILY
          value: "IPv4" 
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CDS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              key: access_key_id
              name: eks-secrets
        - name: CDS_ACCESS_KEY_SECRET
          valueFrom:
            secretKeyRef:
              key: access_key_secret
              name: eks-secrets
        - name: CDS_API_SCHEMA
          valueFrom:
            configMapKeyRef:
              key: openapi_schema
              name: cds-properties
        - name: CDS_API_HOST
          valueFrom:
            configMapKeyRef:
              key: openapi_host
              name: cds-properties
        livenessProbe:
          httpGet:
            path: /healthz
            port: 11023
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: 11023
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 5
          failureThreshold: 5
      tolerations:
      - effect: NoSchedule
        operator: Exists
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpc-cni-webhook
  namespace: kube-system
  labels:
    app: vpc-cni
    component: vpc-cni-webhook
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vpc-cni
      component: vpc-cni-webhook
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: vpc-cni
        component: vpc-cni-webhook
        webhook.vpc-cni.io/ignore: "true"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: vpc-cni
                  component: vpc-cni-webhook
              topologyKey: kubernetes.io/hostname
      priorityClassName: system-cluster-critical
      serviceAccountName: vpc-cni
      hostNetwork: true
      containers:
      - name: vpc-cni-webhook
        image: capitalonline/vpc-cni:v3.0.1
        imagePullPolicy: Always 
        command:
        - /cni/vpc-cni-webhook
        - --default-ip-retain=true
        args:
        - --port=9890
        env:
        - name: DEFAULT_NETWORK_TYPE
          value: "Underlay" 
        - name: DEFAULT_IP_FAMILY
          value: "IPv4" 
        ports:
        - containerPort: 9890
          name: webhook-port
      tolerations:
      - effect: NoSchedule
        operator: Exists
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
